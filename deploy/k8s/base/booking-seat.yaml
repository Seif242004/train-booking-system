# booking-seat: one replica, replaced by "Recreate" (not rolled): its pollers (sweeper, outbox) must never run in two pods at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-seat
  labels: { app: booking-seat }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: booking-seat }
  template:
    metadata:
      labels: { app: booking-seat }
    spec:
      containers:
        - name: booking-seat
          # The overlay maps this name to localhost:5001/tbs/booking-seat:<git sha>.
          image: tbs/booking-seat
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          # Shared, non-secret settings (same names and values as docker-compose.yml).
          envFrom:
            - configMapRef: { name: tbs-config }
            - configMapRef: { name: tbs-spring }
          env:
            - { name: OTEL_SERVICE_NAME, value: booking-seat }
            - { name: INTERNAL_API_KEY, valueFrom: { secretKeyRef: { name: tbs-secrets, key: INTERNAL_API_KEY } } }
            - { name: OPENOBSERVE_USER, valueFrom: { secretKeyRef: { name: tbs-secrets, key: OPENOBSERVE_USER } } }
            - { name: OPENOBSERVE_PASSWORD, valueFrom: { secretKeyRef: { name: tbs-secrets, key: OPENOBSERVE_PASSWORD } } }
            - { name: BOOKING_SEAT_DB_PASSWORD, valueFrom: { secretKeyRef: { name: tbs-secrets, key: BOOKING_SEAT_DB_PASSWORD } } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          # The service has no health endpoint (none is added), so the probes check that the port accepts connections.
          # The startup probe allows up to 5 minutes (Flyway migrations, agent start) before liveness takes over.
          startupProbe:
            tcpSocket: { port: 8082 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: 8082 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8082 }
            periodSeconds: 15
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: booking-seat
spec:
  selector: { app: booking-seat }
  ports:
    - { port: 8082, targetPort: 8082 }
