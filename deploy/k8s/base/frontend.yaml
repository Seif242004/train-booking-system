# Web app (nginx). Built with the Compose default addresses http://localhost:8080 and :8180, which the kind port mappings keep valid.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: tbs/frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 5173 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 5173 }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: frontend }
  ports:
    - { port: 5173, targetPort: 5173 }
