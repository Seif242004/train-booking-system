# Gateway: stateless, so it rolls (a new pod must be Ready before the old one stops). GET /health is public.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: tbs/gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: tbs-config }
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: OTEL_SERVICE_NAME, value: gateway }
            - { name: OPENOBSERVE_URL, value: "http://openobserve:5080/api/default" }
            - { name: INTERNAL_API_KEY, valueFrom: { secretKeyRef: { name: tbs-secrets, key: INTERNAL_API_KEY } } }
            - { name: OPENOBSERVE_USER, valueFrom: { secretKeyRef: { name: tbs-secrets, key: OPENOBSERVE_USER } } }
            - { name: OPENOBSERVE_PASSWORD, valueFrom: { secretKeyRef: { name: tbs-secrets, key: OPENOBSERVE_PASSWORD } } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports:
    - { port: 8080, targetPort: 8080 }
