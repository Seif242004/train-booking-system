name: train-booking

# Settings shared by the five Spring Boot services (YAML anchors).
x-spring-service: &spring-service
  restart: unless-stopped
  depends_on:
    oracle:
      condition: service_healthy
    openobserve:
      condition: service_started
  environment: &spring-env
    # One JSON object per log line on the console (user, booking and trip ids are fields). The OpenTelemetry agent in the image also sends
    # traces and these logs to OpenObserve (see infra/docker/entrypoint-java.sh).
    LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
    OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_METRICS_EXPORTER: none
    # The ids set in the logging context (user, booking, trip, actor) become attributes of every log record in OpenObserve.
    OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES: "*"
    OPENOBSERVE_USER: ${OPENOBSERVE_USER:?set OPENOBSERVE_USER in .env}
    OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:?set OPENOBSERVE_PASSWORD in .env}
    INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    TZ: Africa/Cairo

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: tbs-oracle
    # Bound to loopback so that Gradle runs and tools on the host can reach it; the containers use the service name "oracle".
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      # Password of SYS, SYSTEM and PDBADMIN. Used only by the init script below, never by a service.
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      # One password per service schema, read by infra/oracle/init/01-create-schemas.sh.
      TRAIN_SCHEDULE_DB_PASSWORD: ${TRAIN_SCHEDULE_DB_PASSWORD:?set TRAIN_SCHEDULE_DB_PASSWORD in .env}
      BOOKING_SEAT_DB_PASSWORD: ${BOOKING_SEAT_DB_PASSWORD:?set BOOKING_SEAT_DB_PASSWORD in .env}
      # Optional: the booking_seat_test schema (for the Booking & Seat database tests) is created only if this is set.
      BOOKING_SEAT_TEST_DB_PASSWORD: ${BOOKING_SEAT_TEST_DB_PASSWORD:-}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD in .env}
      # Optional: the payment_test schema (for the Payment database tests) is created only if this is set.
      PAYMENT_TEST_DB_PASSWORD: ${PAYMENT_TEST_DB_PASSWORD:-}
      TICKET_DB_PASSWORD: ${TICKET_DB_PASSWORD:?set TICKET_DB_PASSWORD in .env}
      # Optional: the ticket_test schema (for the Ticket database tests) is created only if this is set.
      TICKET_TEST_DB_PASSWORD: ${TICKET_TEST_DB_PASSWORD:-}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      # Optional: the notification_test schema (for the Notification database tests) is created only if this is set.
      NOTIFICATION_TEST_DB_PASSWORD: ${NOTIFICATION_TEST_DB_PASSWORD:-}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
      # Scripts in this folder run once, on the first start with an empty data volume.
      # To re-run them (new schema, changed password, clean slate): docker compose down -v, then up again.
      # -v deletes the oracle-data volume, so all database content is lost.
      - ./infra/oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      # healthcheck.sh ships with the gvenzl image; it reports healthy once the database accepts connections.
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  keycloak:
    # Custom image: the official one lacks the Oracle JDBC driver (see infra/keycloak/Dockerfile).
    build: ./infra/keycloak
    image: train-booking/keycloak:26.8.1
    container_name: tbs-keycloak
    # start-dev: HTTP, no hostname setup, for local development only.
    # --import-realm creates the realm from infra/keycloak/realm-dev.json if it does not exist yet.
    # The realm lives in Oracle afterwards, so to re-import a changed file: docker compose down -v, then up again.
    command: ["start-dev", "--import-realm"]
    depends_on:
      oracle:
        condition: service_healthy
    # Host port 8180: the API Gateway takes 8080 (step 3). Inside the container Keycloak still listens on 8080.
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      # Fixes the issuer (token `iss`) and all generated URLs to the address the browser and the Gateway use.
      KC_HOSTNAME: http://localhost:8180
      KC_DB: oracle
      KC_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Enables /health/ready on the management port 9000 (not published), used by the healthcheck.
      KC_HEALTH_ENABLED: "true"
      # Substituted into the ${...} placeholders of realm-dev.json at import time.
      KEYCLOAK_DEV_USER_PASSWORD: ${KEYCLOAK_DEV_USER_PASSWORD:?set KEYCLOAK_DEV_USER_PASSWORD in .env}
      KEYCLOAK_DEV_ADMIN_PASSWORD: ${KEYCLOAK_DEV_ADMIN_PASSWORD:?set KEYCLOAK_DEV_ADMIN_PASSWORD in .env}
    volumes:
      - ./infra/keycloak/realm-dev.json:/opt/keycloak/data/import/realm-dev.json:ro
    healthcheck:
      # The image has no curl; bash can open the TCP connection itself.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ---- Dev-only tools (not started by a plain `docker compose up`; use `--profile dev`) ----------------------------------------

  # Forwards Stripe's test-mode events to the Payment webhook through the Gateway, with the signature of the real events:
  #   docker compose --profile dev run --rm stripe-cli listen --api-key $STRIPE_SECRET_KEY --print-secret   -> prints the whsec_... secret once
  #   docker compose --profile dev up stripe-cli                                                             -> forwards the events
  # Put the printed whsec_... in STRIPE_WEBHOOK_SECRET in .env. The Gateway runs on the host and listens on 127.0.0.1 by default, so for the
  # forwarding to reach it from this container start it with HOST=0.0.0.0 (see gateway/README.md).
  stripe-cli:
    profiles: ["dev"]
    image: stripe/stripe-cli:latest
    container_name: tbs-stripe-cli
    depends_on:
      - gateway
    environment:
      # Test-mode secret key only: the CLI is started with it, never with a live key (the Payment service refuses a live key too).
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY (an sk_test_ key) in .env}
    command: >-
      listen
      --forward-to http://gateway:8080/webhooks/payment
      --events payment_intent.succeeded,payment_intent.processing,payment_intent.payment_failed,payment_intent.canceled,refund.updated,refund.failed

  # Catches every email the Notification service sends, so development never sends a real one. SMTP on localhost:1025, web UI and API on
  # http://localhost:8025 (the ticket PDF is an attachment of the message).
  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:latest
    container_name: tbs-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Logs, traces and the audit trail of every service. Web UI and API: http://localhost:5080 (login: OPENOBSERVE_USER / OPENOBSERVE_PASSWORD).
  openobserve:
    image: openobserve/openobserve:v1.1.2
    container_name: tbs-openobserve
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:5080"
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USER:?set OPENOBSERVE_USER in .env}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD:?set OPENOBSERVE_PASSWORD in .env}
      ZO_DATA_DIR: /data
      # The pollers (hold sweeper every second, outbox, e-mail) make many small traces: keep two weeks, not the default ten years.
      ZO_COMPACT_DATA_RETENTION_DAYS: "14"
    volumes:
      - openobserve-data:/data

  train-schedule:
    <<: *spring-service
    build: { context: ., dockerfile: infra/docker/spring.Dockerfile, args: { SERVICE: train-schedule } }
    image: train-booking/train-schedule
    container_name: tbs-train-schedule
    environment:
      <<: *spring-env
      OTEL_SERVICE_NAME: train-schedule
      TRAIN_SCHEDULE_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      TRAIN_SCHEDULE_DB_PASSWORD: ${TRAIN_SCHEDULE_DB_PASSWORD:?set TRAIN_SCHEDULE_DB_PASSWORD in .env}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/train-booking
      # The keys are fetched inside the Compose network; the issuer above stays the address the browser used (it is the token's iss).
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/train-booking/protocol/openid-connect/certs
      BOOKING_SEAT_URL: http://booking-seat:8082

  booking-seat:
    <<: *spring-service
    build: { context: ., dockerfile: infra/docker/spring.Dockerfile, args: { SERVICE: booking-seat } }
    image: train-booking/booking-seat
    container_name: tbs-booking-seat
    environment:
      <<: *spring-env
      OTEL_SERVICE_NAME: booking-seat
      BOOKING_SEAT_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      BOOKING_SEAT_DB_PASSWORD: ${BOOKING_SEAT_DB_PASSWORD:?set BOOKING_SEAT_DB_PASSWORD in .env}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/train-booking
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/train-booking/protocol/openid-connect/certs
      CORS_ORIGIN: http://localhost:5173
      PAYMENT_URL: http://payment:8083
      TICKET_URL: http://ticket:8084
      NOTIFICATION_URL: http://notification:8085
      TRAIN_SCHEDULE_URL: http://train-schedule:8081

  payment:
    <<: *spring-service
    build: { context: ., dockerfile: infra/docker/spring.Dockerfile, args: { SERVICE: payment } }
    image: train-booking/payment
    container_name: tbs-payment
    environment:
      <<: *spring-env
      OTEL_SERVICE_NAME: payment
      PAYMENT_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD in .env}
      BOOKING_SEAT_URL: http://booking-seat:8082
      # Test-mode keys only: the service refuses to start with anything else.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

  ticket:
    <<: *spring-service
    build: { context: ., dockerfile: infra/docker/spring.Dockerfile, args: { SERVICE: ticket } }
    image: train-booking/ticket
    container_name: tbs-ticket
    environment:
      <<: *spring-env
      OTEL_SERVICE_NAME: ticket
      TICKET_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      TICKET_DB_PASSWORD: ${TICKET_DB_PASSWORD:?set TICKET_DB_PASSWORD in .env}
      TICKET_SIGNING_KEY: ${TICKET_SIGNING_KEY:?set TICKET_SIGNING_KEY in .env}

  notification:
    <<: *spring-service
    build: { context: ., dockerfile: infra/docker/spring.Dockerfile, args: { SERVICE: notification } }
    image: train-booking/notification
    container_name: tbs-notification
    environment:
      <<: *spring-env
      OTEL_SERVICE_NAME: notification
      NOTIFICATION_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      # SMTP: Mailpit of the dev profile by default. For a real server set MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD in .env.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}

  # The single entry point (port 8080). Verifies the Keycloak token, routes, composes the seat map and the search, proxies the WebSocket.
  gateway:
    build: { context: ., dockerfile: infra/docker/gateway.Dockerfile }
    image: train-booking/gateway
    container_name: tbs-gateway
    restart: unless-stopped
    depends_on:
      - openobserve
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HOST: 0.0.0.0
      KEYCLOAK_ISSUER: http://localhost:8180/realms/train-booking
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/train-booking/protocol/openid-connect/certs
      CORS_ORIGIN: http://localhost:5173
      TRAIN_SCHEDULE_URL: http://train-schedule:8081
      BOOKING_SEAT_URL: http://booking-seat:8082
      PAYMENT_URL: http://payment:8083
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OPENOBSERVE_URL: http://openobserve:5080/api/default
      OPENOBSERVE_USER: ${OPENOBSERVE_USER:?set OPENOBSERVE_USER in .env}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:?set OPENOBSERVE_PASSWORD in .env}

  # The web app (React, built by Vite, served by nginx) on http://localhost:5173.
  frontend:
    build: { context: ., dockerfile: infra/docker/frontend.Dockerfile }
    image: train-booking/frontend
    container_name: tbs-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  oracle-data:
  openobserve-data:
