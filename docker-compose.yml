# Docker Compose file of the whole system: `docker compose --profile dev up -d --build` builds the images and starts every container.
# Compose reads the secrets from the .env file next to this file (see .env.example for the key names). A "${NAME:?message}" reference stops
# Compose with that message when the key is missing, so a forgotten secret fails at start-up and not later inside a service.
# A "${NAME:-}" reference is optional and becomes an empty string. Every service reaches the others by its service name (oracle, keycloak,
# gateway, ...) on the private network Compose creates; only the services with a `ports` entry can be reached from the host.
# `name` is the Compose project name: it prefixes the network and the volumes (train-booking_oracle-data).
name: train-booking

# Settings shared by the five Spring Boot services (YAML anchors).
x-spring-service: &spring-service
  # restart: a stopped or crashed container is started again by Docker, unless it was stopped by hand with `docker compose stop`.
  restart: unless-stopped
  # depends_on: Compose starts a service only after the services listed here. `service_healthy` waits for the healthcheck of Oracle to pass
  # (the schemas exist and the database accepts connections), so Flyway can run its migrations at once. `service_started` only waits for
  # the container to run, which is enough for OpenObserve: the OpenTelemetry agent retries its export by itself.
  depends_on:
    oracle:
      condition: service_healthy
    openobserve:
      condition: service_started
  # The "&spring-env" anchor lets each service copy this block with "<<: *spring-env" and then add its own variables. In YAML a merge key
  # ("<<") copies the keys of a map; a key written in the service itself wins over the copied one.
  environment: &spring-env
    # One JSON object per log line on the console (user, booking and trip ids are fields). The OpenTelemetry agent in the image also sends
    # traces and these logs to OpenObserve (see infra/docker/entrypoint-java.sh).
    LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
    OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    # Metrics (JVM memory and CPU, the Hikari connection pool, the outbox gauges) go over OTLP to OpenObserve every 30 s: the saturation signals.
    OTEL_METRICS_EXPORTER: otlp
    OTEL_METRIC_EXPORT_INTERVAL: "30000"
    # The ids set in the logging context (user, booking, trip, actor) become attributes of every log record in OpenObserve.
    OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES: "*"
    OPENOBSERVE_USER: ${OPENOBSERVE_USER:?set OPENOBSERVE_USER in .env}
    OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:?set OPENOBSERVE_PASSWORD in .env}
    INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    # TZ: the time zone of the container's clock, so that log lines and the JVM default zone match the railway's own zone.
    # (The booking and ticket times use the trainbooking.timezone property as well; this only fixes the process clock.)
    TZ: Africa/Cairo

# ---- Core infrastructure: Oracle, Keycloak ------------------------------------------------------------------------------------------
services:
  oracle:
    # Oracle Database 23 Free in a container (the "slim" tag is the smaller image). One database, FREEPDB1, holds one schema per service.
    # container_name gives the container a fixed name (tbs-...), so `docker logs tbs-oracle` works whatever the project name is.
    image: gvenzl/oracle-free:23-slim
    container_name: tbs-oracle
    # Bound to loopback so that Gradle runs and tools on the host can reach it; the containers use the service name "oracle".
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      # Password of SYS, SYSTEM and PDBADMIN. Used only by the init script below, never by a service.
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      # One password per service schema, read by infra/oracle/init/01-create-schemas.sh.
      TRAIN_SCHEDULE_DB_PASSWORD: ${TRAIN_SCHEDULE_DB_PASSWORD:?set TRAIN_SCHEDULE_DB_PASSWORD in .env}
      BOOKING_SEAT_DB_PASSWORD: ${BOOKING_SEAT_DB_PASSWORD:?set BOOKING_SEAT_DB_PASSWORD in .env}
      # Optional: the booking_seat_test schema (for the Booking & Seat database tests) is created only if this is set.
      BOOKING_SEAT_TEST_DB_PASSWORD: ${BOOKING_SEAT_TEST_DB_PASSWORD:-}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD in .env}
      # Optional: the payment_test schema (for the Payment database tests) is created only if this is set.
      PAYMENT_TEST_DB_PASSWORD: ${PAYMENT_TEST_DB_PASSWORD:-}
      TICKET_DB_PASSWORD: ${TICKET_DB_PASSWORD:?set TICKET_DB_PASSWORD in .env}
      # Optional: the ticket_test schema (for the Ticket database tests) is created only if this is set.
      TICKET_TEST_DB_PASSWORD: ${TICKET_TEST_DB_PASSWORD:-}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      # Optional: the notification_test schema (for the Notification database tests) is created only if this is set.
      NOTIFICATION_TEST_DB_PASSWORD: ${NOTIFICATION_TEST_DB_PASSWORD:-}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      # Named volume: the database files survive `docker compose down` and are deleted only by `docker compose down -v`.
      - oracle-data:/opt/oracle/oradata
      # Scripts in this folder run once, on the first start with an empty data volume.
      # To re-run them (new schema, changed password, clean slate): docker compose down -v, then up again.
      # -v deletes the oracle-data volume, so all database content is lost.
      - ./infra/oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      # healthcheck.sh ships with the gvenzl image; it reports healthy once the database accepts connections.
      test: ["CMD", "healthcheck.sh"]
      # Healthcheck timing: run the check every 10 s, give each run 5 s, mark the container unhealthy after 30 failures in a row, and do not
      # count failures during the first 60 s (Oracle needs about a minute to create the database on its first start).
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  keycloak:
    # Custom image: the official one lacks the Oracle JDBC driver (see infra/keycloak/Dockerfile).
    build: ./infra/keycloak
    # `build` makes Compose build the image from the Dockerfile in that folder; `image` is the name given to the result.
    image: train-booking/keycloak:26.8.1
    container_name: tbs-keycloak
    # start-dev: HTTP, no hostname setup, for local development only.
    # --import-realm creates the realm from infra/keycloak/realm-dev.json if it does not exist yet.
    # The realm lives in Oracle afterwards, so to re-import a changed file: docker compose down -v, then up again.
    command: ["start-dev", "--import-realm"]
    depends_on:
      oracle:
        condition: service_healthy
    # Host port 8180: the API Gateway takes 8080 (step 3). Inside the container Keycloak still listens on 8080.
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      # Fixes the issuer (token `iss`) and all generated URLs to the address the browser and the Gateway use.
      KC_HOSTNAME: http://localhost:8180
      # KC_DB, KC_DB_URL, KC_DB_USERNAME, KC_DB_PASSWORD: Keycloak keeps its realm, users and password hashes in the Oracle schema
      # "keycloak".
      # FREEPDB1 is the name of the pluggable database inside Oracle Free; "//oracle:1521/..." is the service name of the Oracle container.
      KC_DB: oracle
      KC_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      # The first administrator of the master realm (Keycloak's own admin console). It is created only when the database is still empty.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Enables /health/ready on the management port 9000 (not published), used by the healthcheck.
      KC_HEALTH_ENABLED: "true"
      # Substituted into the ${...} placeholders of realm-dev.json at import time.
      KEYCLOAK_DEV_USER_PASSWORD: ${KEYCLOAK_DEV_USER_PASSWORD:?set KEYCLOAK_DEV_USER_PASSWORD in .env}
      KEYCLOAK_DEV_ADMIN_PASSWORD: ${KEYCLOAK_DEV_ADMIN_PASSWORD:?set KEYCLOAK_DEV_ADMIN_PASSWORD in .env}
    volumes:
      # A bind mount (a host file shown inside the container). ":ro" means read-only: the container cannot change the file.
      - ./infra/keycloak/realm-dev.json:/opt/keycloak/data/import/realm-dev.json:ro
      # The login theme "train-booking" (CSS on top of keycloak.v2). start-dev does not cache themes, so edits show after a reload.
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # The image has no curl; bash can open the TCP connection itself.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # A profile marks services that start only when you pass `--profile dev`. The tools below are for development: they are not part of the
  # system the passengers use (stripe-cli and mailpit carry `profiles: ["dev"]`).
  # ---- Dev-only tools (not started by a plain `docker compose up`; use `--profile dev`) ----------------------------------------

  # Forwards Stripe's test-mode events to the Payment webhook through the Gateway, with the signature of the real events:
  #   docker compose --profile dev run --rm stripe-cli listen --api-key $STRIPE_SECRET_KEY --print-secret   -> prints the whsec_... secret once
  #   docker compose --profile dev up stripe-cli                                                             -> forwards the events
  # Put the printed whsec_... in STRIPE_WEBHOOK_SECRET in .env. The Gateway runs as a container in this stack (service `gateway`, port 8080), and the CLI forwards to
  # http://gateway:8080/webhooks/payment.
  stripe-cli:
    profiles: ["dev"]
    image: stripe/stripe-cli:latest
    container_name: tbs-stripe-cli
    depends_on:
      - gateway
    environment:
      # Test-mode secret key only: the CLI is started with it, never with a live key (the Payment service refuses a live key too).
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY (an sk_test_ key) in .env}
    # command: replaces the default command of the image (the `stripe` CLI executable). The `>-` block is one folded line without a trailing
    # newline. The listed events are the ones the Payment service handles; the CLI signs each one like Stripe does, so the webhook
    # check passes.
    command: >-
      listen
      --forward-to http://gateway:8080/webhooks/payment
      --events payment_intent.succeeded,payment_intent.processing,payment_intent.payment_failed,payment_intent.canceled,refund.updated,refund.failed

  # Catches every email the Notification service sends, so development never sends a real one. SMTP on localhost:1025, web UI and API on
  # http://localhost:8025 (the ticket PDF is an attachment of the message).
  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:latest
    container_name: tbs-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Logs, traces and the audit trail of every service. Web UI and API: http://localhost:5080 (login: OPENOBSERVE_USER / OPENOBSERVE_PASSWORD).
  openobserve:
    # ZO_* variables below are OpenObserve settings: the root login of its web UI, the folder of its data and how long it keeps the data.
    # The version is pinned so that a new release cannot change the behaviour of the stack by surprise.
    image: openobserve/openobserve:v1.1.2
    container_name: tbs-openobserve
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:5080"
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USER:?set OPENOBSERVE_USER in .env}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD:?set OPENOBSERVE_PASSWORD in .env}
      ZO_DATA_DIR: /data
      # The pollers (hold sweeper every second, outbox, e-mail) make many small traces: keep two weeks, not the default ten years.
      ZO_COMPACT_DATA_RETENTION_DAYS: "14"
      # SMTP for the alert e-mails. Same rule as the Notification service: Mailpit of the dev profile unless MAIL_* is set in .env.
      # OpenObserve starts without a reachable SMTP server (an alert e-mail then fails and is logged, nothing else breaks).
      ZO_SMTP_ENABLED: "true"
      ZO_SMTP_HOST: ${MAIL_HOST:-mailpit}
      ZO_SMTP_PORT: ${MAIL_PORT:-1025}
      ZO_SMTP_USER_NAME: ${MAIL_USERNAME:-}
      ZO_SMTP_PASSWORD: ${MAIL_PASSWORD:-}
      # "off" = plain SMTP (Mailpit), "starttls" when MAIL_STARTTLS=true.
      ZO_SMTP_ENCRYPTION: ${OPENOBSERVE_SMTP_ENCRYPTION:-off}
      ZO_SMTP_FROM_EMAIL: ${ALERT_EMAIL_FROM:-tbs-alerts@example.invalid}
    volumes:
      # Named volume with the logs, traces and dashboards of OpenObserve.
      - openobserve-data:/data

  # ---- The five Spring Boot services ----------------------------------------------------------------------------------------------------
  # Each one is built from the same recipe (infra/docker/spring.Dockerfile) with a different SERVICE argument, merges the shared settings
  # of x-spring-service at the top, and adds its own database, Keycloak and neighbour addresses. The host addresses in
  # application.properties
  # (localhost) are replaced here by the service names, through environment variables. No Spring service publishes a port: browsers reach
  # them only through the Gateway, and the services reach each other on the private network.
  # Train & Schedule (port 8081): timetable data. Pushes a copy of each trip to Booking & Seat.
  train-schedule:
    <<: *spring-service
    # context "." is the repository root (the Dockerfile needs gradlew and services/); args.SERVICE says which Gradle subproject to package.
    build: { context: ., dockerfile: infra/docker/spring.Dockerfile, args: { SERVICE: train-schedule } }
    image: train-booking/train-schedule
    container_name: tbs-train-schedule
    environment:
      <<: *spring-env
      # OTEL_SERVICE_NAME is the name under which the OpenTelemetry agent files the traces and logs of this service in OpenObserve.
      OTEL_SERVICE_NAME: train-schedule
      # The database address and password fill the ${TRAIN_SCHEDULE_DB_URL} and ${TRAIN_SCHEDULE_DB_PASSWORD} placeholders of
      # application.properties. The user name has a default there (train_schedule).
      TRAIN_SCHEDULE_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      TRAIN_SCHEDULE_DB_PASSWORD: ${TRAIN_SCHEDULE_DB_PASSWORD:?set TRAIN_SCHEDULE_DB_PASSWORD in .env}
      # The issuer is the address the BROWSER uses for Keycloak, because it is written into every token ("iss"). A service accepts
      # a token only
      # when its "iss" equals this value, which is why it is not the internal address http://keycloak:8080.
      KEYCLOAK_ISSUER: http://localhost:8180/realms/train-booking
      # The keys are fetched inside the Compose network; the issuer above stays the address the browser used (it is the token's iss).
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/train-booking/protocol/openid-connect/certs
      # Where to push the trip snapshot (Booking & Seat keeps its own copy of the timetable).
      BOOKING_SEAT_URL: http://booking-seat:8082

  # Booking & Seat (port 8082): availability, holds, bookings, cancellation, live updates. Talks to Payment, Ticket, Notification and
  # Train & Schedule.
  booking-seat:
    <<: *spring-service
    build: { context: ., dockerfile: infra/docker/spring.Dockerfile, args: { SERVICE: booking-seat } }
    image: train-booking/booking-seat
    container_name: tbs-booking-seat
    environment:
      <<: *spring-env
      OTEL_SERVICE_NAME: booking-seat
      BOOKING_SEAT_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      BOOKING_SEAT_DB_PASSWORD: ${BOOKING_SEAT_DB_PASSWORD:?set BOOKING_SEAT_DB_PASSWORD in .env}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/train-booking
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/train-booking/protocol/openid-connect/certs
      # The one browser origin (the web app) allowed to open a WebSocket on /ws.
      CORS_ORIGIN: http://localhost:5173
      # The neighbours Booking & Seat calls (through its outbox, except Payment's create and cancel calls).
      PAYMENT_URL: http://payment:8083
      TICKET_URL: http://ticket:8084
      NOTIFICATION_URL: http://notification:8085
      TRAIN_SCHEDULE_URL: http://train-schedule:8081

  # Payment (port 8083): Stripe payments, webhook handling, refunds. Internal API only.
  payment:
    <<: *spring-service
    build: { context: ., dockerfile: infra/docker/spring.Dockerfile, args: { SERVICE: payment } }
    image: train-booking/payment
    container_name: tbs-payment
    environment:
      <<: *spring-env
      OTEL_SERVICE_NAME: payment
      PAYMENT_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD in .env}
      BOOKING_SEAT_URL: http://booking-seat:8082
      # The three Stripe values come from .env. They may be empty: the service then starts, but every call that needs Stripe answers 503.
      # Test-mode keys only: the service refuses to start with anything else.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

  # Ticket (port 8084): PDF ticket with QR code. Internal API only.
  ticket:
    <<: *spring-service
    build: { context: ., dockerfile: infra/docker/spring.Dockerfile, args: { SERVICE: ticket } }
    image: train-booking/ticket
    container_name: tbs-ticket
    environment:
      <<: *spring-env
      OTEL_SERVICE_NAME: ticket
      TICKET_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      TICKET_DB_PASSWORD: ${TICKET_DB_PASSWORD:?set TICKET_DB_PASSWORD in .env}
      # The secret that signs the token in the QR code (see .env.example).
      TICKET_SIGNING_KEY: ${TICKET_SIGNING_KEY:?set TICKET_SIGNING_KEY in .env}

  # Notification (port 8085): emails with retries. Internal API only.
  notification:
    <<: *spring-service
    build: { context: ., dockerfile: infra/docker/spring.Dockerfile, args: { SERVICE: notification } }
    image: train-booking/notification
    container_name: tbs-notification
    environment:
      <<: *spring-env
      OTEL_SERVICE_NAME: notification
      NOTIFICATION_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      # SMTP: Mailpit of the dev profile by default. For a real server set MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD in .env.
      # The ":-default" form gives a default: without MAIL_* in .env the service sends to Mailpit (host "mailpit", port 1025, no login).
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}

  # The single entry point (port 8080). Verifies the Keycloak token, routes, composes the seat map and the search, proxies the WebSocket.
  gateway:
    build: { context: ., dockerfile: infra/docker/gateway.Dockerfile }
    image: train-booking/gateway
    container_name: tbs-gateway
    restart: unless-stopped
    depends_on:
      - openobserve
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Inside a container the Gateway must listen on all interfaces; the `ports` entry above still publishes it on the host's
      # loopback only.
      HOST: 0.0.0.0
      KEYCLOAK_ISSUER: http://localhost:8180/realms/train-booking
      # JWKS = the public keys of the realm. The Gateway fetches them inside the Compose network and caches them to check token signatures.
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/train-booking/protocol/openid-connect/certs
      CORS_ORIGIN: http://localhost:5173
      # The upstream services the Gateway forwards to. The Gateway holds the internal key only for the calls it makes on its own.
      TRAIN_SCHEDULE_URL: http://train-schedule:8081
      BOOKING_SEAT_URL: http://booking-seat:8082
      PAYMENT_URL: http://payment:8083
      TICKET_URL: http://ticket:8084
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # The Gateway sends its own JSON log lines to OpenObserve in batches (src/log.js), and its traces over OTLP (src/telemetry.js).
      OPENOBSERVE_URL: http://openobserve:5080/api/default
      OPENOBSERVE_USER: ${OPENOBSERVE_USER:?set OPENOBSERVE_USER in .env}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:?set OPENOBSERVE_PASSWORD in .env}

  # The web app (React, built by Vite, served by nginx) on http://localhost:5173.
  frontend:
    build: { context: ., dockerfile: infra/docker/frontend.Dockerfile }
    image: train-booking/frontend
    container_name: tbs-frontend
    restart: unless-stopped
    ports:
      # host:container. The browser must open this exact address: Keycloak's web-app client and the Gateway's CORS rule name it.
      - "127.0.0.1:5173:5173"

# Named volumes are managed by Docker; they hold the data that must survive a container being rebuilt.
volumes:
  oracle-data:
  openobserve-data:
