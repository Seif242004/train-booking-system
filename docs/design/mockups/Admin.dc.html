<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin trains</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#191329;background:#f4f3f5}
a{color:inherit;text-decoration:none}
button,input,select{font-family:inherit}
:focus-visible{outline:3px solid #191329;outline-offset:2px}
.side a{transition:background .15s ease}
.side a:hover{background:#2a2240}
tbody tr{transition:background .15s ease}
tbody tr:hover{background:#faf9fb}
.go{transition:background .15s ease,transform .15s ease}
.go:hover{background:#b80600}
.go:active{transform:scale(.98)}
.ghost{transition:border-color .15s ease,background .15s ease}
.ghost:hover{border-color:#e10801;background:#fff4f3}
.field input,.field select{transition:border-color .15s ease,box-shadow .15s ease}
.field input:focus,.field select:focus{border-color:#e10801;box-shadow:0 0 0 4px rgba(225,8,1,.12);outline:none}
.panel{animation:panel .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes panel{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.side a,tbody tr,.go,.ghost,.field input,.field select{transition:none}}
</style>
</helmet>

<div style="min-height:1040px;background:#f4f3f5;color:#191329;font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-wrap:wrap">

  <!-- Sidebar -->
  <aside class="side" style="flex:0 0 248px;flex-grow:1;max-width:100%;background:#191329;color:#fff;padding:24px 16px;box-sizing:border-box">
    <a href="Main.dc.html" aria-label="etisalat, home" style="display:block;padding:4px 12px 24px">
      <img src="/_blob/584694e5f041472bd3b0ef3cfdb8fb23" alt="etisalat" style="height:28px;width:auto;display:block">
    </a>
    <p style="margin:0 12px 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#bdb6cc">Admin</p>
    <nav aria-label="Admin" style="display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:600">
      <a href="Admin.dc.html" style="padding:12px;border-radius:12px;color:#e4e0ee">Stations</a>
      <a href="Admin.dc.html" aria-current="page" style="padding:12px;border-radius:12px;background:{{accent}};color:#fff">Trains</a>
      <a href="Admin.dc.html" style="padding:12px;border-radius:12px;color:#e4e0ee">Trips</a>
      <a href="Admin.dc.html" style="padding:12px;border-radius:12px;color:#e4e0ee">Bookings</a>
      <a href="Admin.dc.html" style="padding:12px;border-radius:12px;color:#e4e0ee">Audit log</a>
    </nav>
  </aside>

  <!-- Content -->
  <div style="flex:999 1 640px;min-width:0">
    <div style="padding:20px 32px;background:#fff;border-bottom:1px solid #e6e2ec;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
      <p style="margin:0;font-size:14px;font-weight:600;color:#5f5873">Admin / Trains</p>
      <span style="font-size:14px;font-weight:700">Seif T. · Admin</span>
    </div>

    <div style="padding:32px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">

      <!-- List -->
      <section style="flex:1 1 480px;min-width:0">
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px">
          <h1 style="margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em">Trains</h1>
          <button class="go" type="button" style="min-height:48px;padding:0 22px;border:0;border-radius:12px;background:{{accent}};color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add train
          </button>
        </div>

        <div style="background:#fff;border-radius:20px;box-shadow:0 2px 8px rgba(25,19,41,.05);overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;min-width:520px;font-size:15px">
            <thead>
              <tr style="text-align:left;color:#5f5873;font-size:12px;letter-spacing:.05em;text-transform:uppercase">
                <th scope="col" style="padding:16px 24px;font-weight:700">Train</th>
                <th scope="col" style="padding:16px 12px;font-weight:700">Type</th>
                <th scope="col" style="padding:16px 12px;font-weight:700">Coaches</th>
                <th scope="col" style="padding:16px 12px;font-weight:700">Status</th>
                <th scope="col" style="padding:16px 24px;font-weight:700"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Actions</span></th>
              </tr>
            </thead>
            <tbody>
              <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
                <tr style="border-top:1px solid #eeebf2;background:{{r.bg}}">
                  <th scope="row" style="padding:16px 24px;text-align:left;font-weight:800">{{r.number}}</th>
                  <td style="padding:16px 12px">{{r.type}}</td>
                  <td style="padding:16px 12px">{{r.coaches}}</td>
                  <td style="padding:16px 12px"><span style="display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:{{r.chipBg}};color:{{r.chipFg}};font-size:13px;font-weight:700"><span aria-hidden="true" style="width:7px;height:7px;border-radius:999px;background:{{r.chipFg}}"></span>{{r.status}}</span></td>
                  <td style="padding:8px 24px;text-align:right"><button class="ghost" type="button" aria-label="{{r.editLabel}}" style="min-height:44px;padding:0 16px;border:1.5px solid #cfc9d8;border-radius:12px;background:#fff;font-size:14px;font-weight:700;cursor:pointer">Edit</button></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Edit panel -->
      <section class="panel" aria-label="Edit train 981" style="flex:0 1 380px;min-width:300px;background:#fff;border-radius:20px;padding:28px;box-shadow:0 18px 48px rgba(25,19,41,.12)">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px">
          <h2 style="margin:0;font-size:20px;font-weight:800">Edit train 981</h2>
          <button type="button" aria-label="Close panel" style="width:44px;height:44px;border-radius:999px;border:0;background:transparent;cursor:pointer;color:#5f5873;display:flex;align-items:center;justify-content:center">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <form onSubmit="{{noSubmit}}" style="display:flex;flex-direction:column;gap:18px">
          <div class="field" style="display:flex;flex-direction:column;gap:6px">
            <label for="tn" style="font-size:13px;font-weight:700;color:#3b3450">Train number</label>
            <input id="tn" type="text" value="981" style="height:52px;box-sizing:border-box;width:100%;border:1.5px solid #dcd8e2;border-radius:14px;padding:0 16px;font-size:16px;color:#191329;background:#fff">
          </div>
          <div class="field" style="display:flex;flex-direction:column;gap:6px">
            <label for="tt" style="font-size:13px;font-weight:700;color:#3b3450">Type</label>
            <select id="tt" style="height:52px;box-sizing:border-box;width:100%;border:1.5px solid #dcd8e2;border-radius:14px;padding:0 12px;font-size:16px;color:#191329;background:#fff">
              <option>Express</option>
              <option>Standard</option>
            </select>
          </div>
          <div class="field" style="display:flex;flex-direction:column;gap:6px">
            <label for="tc" style="font-size:13px;font-weight:700;color:#3b3450">Coaches</label>
            <input id="tc" type="text" inputmode="numeric" value="6" style="height:52px;box-sizing:border-box;width:100%;border:1.5px solid #dcd8e2;border-radius:14px;padding:0 16px;font-size:16px;color:#191329;background:#fff">
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:6px">
            <button class="go" type="submit" style="flex:1 1 140px;min-height:52px;border:0;border-radius:14px;background:{{accent}};color:#fff;font-size:16px;font-weight:700;cursor:pointer">Save changes</button>
            <button class="ghost" type="button" style="flex:1 1 100px;min-height:52px;border:1.5px solid #cfc9d8;border-radius:14px;background:#fff;color:#191329;font-size:16px;font-weight:700;cursor:pointer">Cancel</button>
          </div>
        </form>
      </section>
    </div>
  </div>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#e10801","options":["#e10801","#c20700","#191329"]},"$preview":{"width":1280,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    // Sample rows
    const defs = [
      { number: '981', type: 'Express', coaches: 6, status: 'Active', sel: true },
      { number: '1003', type: 'Express', coaches: 6, status: 'Active' },
      { number: '937', type: 'Standard', coaches: 8, status: 'Active' },
      { number: '1015', type: 'Standard', coaches: 8, status: 'Active' },
      { number: '752', type: 'Standard', coaches: 5, status: 'Inactive' }
    ];
    const rows = defs.map((d) => ({
      number: d.number, type: d.type, coaches: d.coaches, status: d.status,
      bg: d.sel ? '#fff4f3' : 'transparent',
      chipBg: d.status === 'Active' ? '#d9f3e3' : '#e9e6ee',
      chipFg: d.status === 'Active' ? '#005c25' : '#3b3450',
      editLabel: 'Edit train ' + d.number
    }));
    return {
      accent: this.props.accent ?? '#e10801',
      rows,
      noSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); }
    };
  }
}
</script>
</body>
</html>
