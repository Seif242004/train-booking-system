<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your ticket</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#191329;background:#f4f3f5}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:3px solid #191329;outline-offset:2px}
.go{transition:background .15s ease,transform .15s ease}
.go:hover{background:#b80600}
.go:active{transform:scale(.98)}
.ghost{transition:border-color .15s ease,background .15s ease}
.ghost:hover{border-color:#e10801;background:#fff4f3}
.nav a{transition:opacity .15s ease}
.nav a:hover{opacity:.8}
.ring{stroke-dasharray:170;stroke-dashoffset:170;animation:draw .7s .1s ease-out forwards}
.tick{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .7s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ticket{animation:rise .7s .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
.ring,.tick{animation:none;stroke-dashoffset:0}
.ticket{animation:none}
.go,.ghost,.nav a{transition:none}
}
</style>
</helmet>

<div style="min-height:1040px;background:#f4f3f5;color:#191329;font-family:'Plus Jakarta Sans',system-ui,sans-serif">

  <header style="background:{{accent}}">
    <div style="max-width:1120px;margin:0 auto;padding:16px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
      <a href="Main.dc.html" aria-label="etisalat, home" style="display:block">
        <img src="/_blob/584694e5f041472bd3b0ef3cfdb8fb23" alt="etisalat" style="height:30px;width:auto;display:block">
      </a>
      <nav class="nav" aria-label="Main" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;color:#fff;font-size:15px;font-weight:600">
        <a href="Main.dc.html" style="padding:12px 0">Search trains</a>
        <a href="MyBookings.dc.html" style="padding:12px 0">My bookings</a>
        <a href="MyBookings.dc.html" style="padding:12px 20px;background:#fff;color:#c20700;border-radius:999px;font-weight:700">Seif T.</a>
      </nav>
    </div>
  </header>

  <main style="max-width:760px;margin:0 auto;padding:48px 24px 96px">

    <!-- Confirmation -->
    <div style="text-align:center">
      <svg aria-hidden="true" width="84" height="84" viewBox="0 0 64 64" fill="none" style="display:block;margin:0 auto">
        <circle class="ring" cx="32" cy="32" r="27" stroke="#00b64c" stroke-width="4" stroke-linecap="round" transform="rotate(-90 32 32)"/>
        <path class="tick" d="M20 33l8 8 16-17" stroke="#00b64c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 style="margin:18px 0 0;font-size:36px;font-weight:800;letter-spacing:-.02em">You're booked</h1>
      <p style="margin:10px 0 0;font-size:16px;line-height:1.6;color:#5f5873">Payment received. We sent a copy of your ticket to your email.</p>
    </div>

    <!-- Ticket -->
    <article class="ticket" aria-label="Ticket" style="margin-top:36px;background:#fff;border-radius:28px;box-shadow:0 20px 56px rgba(25,19,41,.14);overflow:hidden">

      <div style="background:{{accent}};color:#fff;padding:20px 32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
        <img src="/_blob/584694e5f041472bd3b0ef3cfdb8fb23" alt="etisalat" style="height:26px;width:auto;display:block">
        <span style="font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Train ticket</span>
      </div>

      <div style="padding:32px;display:flex;flex-wrap:wrap;gap:28px 40px">
        <div style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:24px">

          <div style="display:flex;align-items:center;gap:16px">
            <div>
              <p style="margin:0;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1">05:30</p>
              <p style="margin:6px 0 0;font-size:16px;font-weight:700">Cairo</p>
            </div>
            <div aria-hidden="true" style="flex:1 1 auto;display:flex;align-items:center;gap:6px;min-width:40px">
              <span style="width:8px;height:8px;border-radius:999px;background:#e10801"></span>
              <span style="flex:1 1 auto;height:2px;background:#e4c3c1"></span>
              <span style="width:8px;height:8px;border-radius:999px;background:#e10801"></span>
            </div>
            <div style="text-align:right">
              <p style="margin:0;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1">09:55</p>
              <p style="margin:6px 0 0;font-size:16px;font-weight:700">Assiut</p>
            </div>
          </div>

          <dl style="margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 24px">
            <div><dt style="font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#5f5873">Date</dt><dd style="margin:4px 0 0;font-size:17px;font-weight:700">Tue 3 Nov 2026</dd></div>
            <div><dt style="font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#5f5873">Train</dt><dd style="margin:4px 0 0;font-size:17px;font-weight:700">981</dd></div>
            <div><dt style="font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#5f5873">Passenger</dt><dd style="margin:4px 0 0;font-size:17px;font-weight:700">Seif Tamer</dd></div>
            <div><dt style="font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#5f5873">Class</dt><dd style="margin:4px 0 0;font-size:17px;font-weight:700">Second class</dd></div>
            <div><dt style="font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#5f5873">Coach</dt><dd style="margin:4px 0 0;font-size:17px;font-weight:700">3</dd></div>
            <div><dt style="font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#5f5873">Seats</dt><dd style="margin:4px 0 0;font-size:17px;font-weight:700">5C, 5D</dd></div>
          </dl>
        </div>

        <!-- Perforation -->
        <div aria-hidden="true" style="flex:0 0 2px;align-self:stretch;border-left:2px dashed #dcd8e2"></div>

        <!-- Code -->
        <div style="flex:0 1 200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin:0 auto">
          <svg role="img" aria-label="Ticket QR code placeholder" width="176" height="176" viewBox="0 0 25 25" shape-rendering="crispEdges" style="display:block">
            <rect width="25" height="25" fill="#fff"/>
            <g fill="#191329">
              <rect x="0" y="0" width="7" height="7"/><rect x="18" y="0" width="7" height="7"/><rect x="0" y="18" width="7" height="7"/>
            </g>
            <g fill="#fff">
              <rect x="1" y="1" width="5" height="5"/><rect x="19" y="1" width="5" height="5"/><rect x="1" y="19" width="5" height="5"/>
            </g>
            <g fill="#191329">
              <rect x="2" y="2" width="3" height="3"/><rect x="20" y="2" width="3" height="3"/><rect x="2" y="20" width="3" height="3"/>
              <sc-for list="{{cells}}" as="c" hint-placeholder-count="120">
                <rect x="{{c.x}}" y="{{c.y}}" width="1" height="1"/>
              </sc-for>
            </g>
          </svg>
          <p style="margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;color:#3b3450">BOOKING REF</p>
          <p style="margin:-8px 0 0;font-size:22px;font-weight:800;letter-spacing:.06em">7F3K29</p>
        </div>
      </div>
    </article>

    <!-- Actions -->
    <div style="margin-top:28px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center">
      <button class="go" type="button" style="min-height:54px;padding:0 28px;border:0;border-radius:14px;background:{{accent}};color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
        Download PDF
      </button>
      <a class="ghost" href="MyBookings.dc.html" style="min-height:54px;box-sizing:border-box;padding:0 28px;border:1.5px solid #cfc9d8;border-radius:14px;background:#fff;color:#191329;font-size:16px;font-weight:700;display:flex;align-items:center">View my bookings</a>
    </div>
  </main>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#e10801","options":["#e10801","#c20700","#191329"]},"$preview":{"width":1280,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    // Decorative placeholder pattern for the QR code, deterministic.
    const cells = [];
    for (let y = 0; y < 25; y++) {
      for (let x = 0; x < 25; x++) {
        const inFinder = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16);
        if (inFinder) continue;
        if (((x * 7 + y * 13 + x * y) % 5) < 2) cells.push({ x, y });
      }
    }
    return { accent: this.props.accent ?? '#e10801', cells };
  }
}
</script>
</body>
</html>
