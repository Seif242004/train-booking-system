server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: every path that is not a file is the app (React Router decides).
    location / {
        try_files $uri /index.html;
    }
    # Hashed build files can be cached for good; index.html never.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
