# One nginx virtual server: the web app. The file is copied to /etc/nginx/conf.d/default.conf by frontend.Dockerfile.
server {
    # The port inside the container. It matches the origin http://localhost:5173 that Keycloak's client and the Gateway's CORS rule allow.
    listen 5173;
    # Where the Vite build output was copied.
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: every path that is not a file is the app (React Router decides).
    location / {
        # Try the exact file; if there is none, send index.html. Without this a reload on /trips/3/seats would answer 404 from nginx.
        try_files $uri /index.html;
    }
    # Hashed build files can be cached for good; index.html never.
    location /assets/ {
        # The file names under /assets/ contain a hash of their content, so a changed file gets a new name and the old one may be
        # cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        # index.html names the current hashed files, so the browser must always fetch it again after a new build.
        add_header Cache-Control "no-store";
    }
}
