# Account console theme "train-booking": the built-in keycloak.v3 account console, restyled with CSS only (resources/css/train-booking-account.css).
# parent: every page, script and string we do not provide ourselves is taken from keycloak.v3.
parent=keycloak.v3

# styles: our stylesheet, added after the parent's. Later files win when two rules have the same weight.
styles=css/train-booking-account.css

# logo: the header image, found in resources/ of this theme (the same white wordmark as the web app and the login theme).
logo=img/logo-etisalat-white.png

# Light only, like the login theme: the page does not switch to the dark theme with the browser setting.
darkMode=false
