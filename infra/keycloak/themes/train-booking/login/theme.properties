# Login theme "train-booking": the built-in keycloak.v2 theme, restyled with CSS only (see resources/css/train-booking.css).
parent=keycloak.v2

# The parent's own stylesheet first, ours after it. Keycloak finds css/styles.css in the parent theme.
styles=css/styles.css css/train-booking.css

# Light only: the page is designed on white and does not switch to the dark theme with the browser setting.
darkMode=false
