spring.application.name=booking-seat
server.port=8082

# Local secrets live in services/booking-seat/.env (git-ignored); see .env.example. Imported as properties.
spring.config.import=optional:file:.env[.properties]

# Own Oracle schema (user): this service never reads another service's tables. Flyway uses the same user.
spring.datasource.url=${BOOKING_SEAT_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${BOOKING_SEAT_DB_USER:booking_seat}
spring.datasource.password=${BOOKING_SEAT_DB_PASSWORD}

# Resource server: tokens are checked against the Keycloak realm (signature via its JWKS, expiry and issuer).
# The issuer is looked up on the first request, so the service can start before Keycloak is up.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8180/realms/train-booking}

# The one origin that may open a WebSocket (the web app). The Gateway passes the Origin of the browser on.
trainbooking.ws.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# Shared key for service-to-service calls (/internal/**). There is no default: the service does not start without it.
trainbooking.internal-api-key=${INTERNAL_API_KEY}

# Where the Payment service runs: Booking asks it to create, invalidate and cancel the payment of a booking.
trainbooking.payment.url=${PAYMENT_URL:http://localhost:8083}

# Where the Ticket and Notification services run: Booking asks them, through its outbox, to make the ticket and send the emails.
trainbooking.ticket.url=${TICKET_URL:http://localhost:8084}
trainbooking.notification.url=${NOTIFICATION_URL:http://localhost:8085}

# Where Train & Schedule runs: Booking asks it to mark a trip cancelled when an admin cancels the whole trip (Flow 8).
trainbooking.train-schedule.url=${TRAIN_SCHEDULE_URL:http://localhost:8081}
