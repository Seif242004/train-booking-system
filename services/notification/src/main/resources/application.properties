# application.properties holds the settings Spring Boot reads at start-up. "${NAME:default}" reads the environment variable NAME and
# uses the text after the colon when it is not set; "${NAME}" has no default, so a missing value stops the start (or leaves it empty).
# Environment variables win over this file, which is how docker-compose.yml points the service at the other containers.
# application.name is the name shown in logs. server.port is the HTTP port.
spring.application.name=notification
server.port=8085

# Local secrets live in services/notification/.env (git-ignored); see .env.example. Imported as properties.
# optional: no error if the file is missing. file:.env is read from the working folder; [.properties] says to parse it as KEY=value lines.
spring.config.import=optional:file:.env[.properties]

# Own Oracle schema (user): this service never reads another service's tables. Flyway uses the same user.
# JDBC address of Oracle: host localhost, port 1521, service FREEPDB1 (the pluggable database). Flyway, which runs the migrations
# at start-up,
# uses these same three settings.
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${NOTIFICATION_DB_USER:notification}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}

# Shared key for service-to-service calls (/internal/**). There is no default: the service does not start without it.
# "trainbooking.*" are this project's own settings (not Spring's). Notification has no Keycloak settings: it is internal only.
trainbooking.internal-api-key=${INTERNAL_API_KEY}

# SMTP. In development this is Mailpit (the dev profile of Compose): it catches every mail and shows it at http://localhost:8025.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
# username and password stay empty for Mailpit. mail.smtp.auth and mail.smtp.starttls.enable are JavaMail properties passed through Spring.
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# Timeouts in milliseconds: 5 s to open the connection, 10 s to read a reply and 10 s to write. A slow SMTP server then fails the attempt
# (the email stays queued and is retried) instead of blocking the sender thread.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# The sender address of every email.
trainbooking.mail.from=${MAIL_FROM:tickets@trainbooking.local}

# How often the unsent emails are tried (fixedDelay), and the time zone of the times in the emails.
trainbooking.notification.fixed-delay-ms=1000
trainbooking.timezone=${TIMEZONE:Africa/Cairo}
