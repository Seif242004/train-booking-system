spring.application.name=notification
server.port=8085

# Local secrets live in services/notification/.env (git-ignored); see .env.example. Imported as properties.
spring.config.import=optional:file:.env[.properties]

# Own Oracle schema (user): this service never reads another service's tables. Flyway uses the same user.
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${NOTIFICATION_DB_USER:notification}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}

# Shared key for service-to-service calls (/internal/**). There is no default: the service does not start without it.
trainbooking.internal-api-key=${INTERNAL_API_KEY}

# SMTP. In development this is Mailpit (the dev profile of Compose): it catches every mail and shows it at http://localhost:8025.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
trainbooking.mail.from=${MAIL_FROM:tickets@trainbooking.local}

# How often the unsent emails are tried (fixedDelay), and the time zone of the times in the emails.
trainbooking.notification.fixed-delay-ms=1000
trainbooking.timezone=${TIMEZONE:Africa/Cairo}
