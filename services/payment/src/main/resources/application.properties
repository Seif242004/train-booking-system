spring.application.name=payment
server.port=8083

# Local secrets live in services/payment/.env (git-ignored); see .env.example. Imported as properties.
# The root .env (two folders up when run from this folder with Gradle) holds the Stripe test keys; this folder's own .env may override it.
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties]

# Own Oracle schema (user): this service never reads another service's tables. Flyway uses the same user.
spring.datasource.url=${PAYMENT_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${PAYMENT_DB_USER:payment}
spring.datasource.password=${PAYMENT_DB_PASSWORD}

# Shared key for service-to-service calls (/internal/**). There is no default: the service does not start without it.
trainbooking.internal-api-key=${INTERNAL_API_KEY}

# Where Booking and Seat runs: Payment tells it about payments and refunds (through the outbox).
trainbooking.booking-seat.url=${BOOKING_SEAT_URL:http://localhost:8082}

# Stripe, in test mode in development. The secret key and the webhook secret never leave this service; the publishable key is
# public by design and is handed to the browser with the client secret. Without a secret key the service starts but cannot
# reach Stripe (every call that needs it answers 503); there is no fake Stripe.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# How often the outbox (the news for Booking and Seat) and the unfinished refunds are retried.
trainbooking.outbox.fixed-delay-ms=1000
