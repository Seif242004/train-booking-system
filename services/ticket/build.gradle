// Group, version, repositories, the Java 21 toolchain and JUnit are configured once in the root build.gradle.
plugins {
	id 'java'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management' // already on the classpath through the Spring Boot plugin declared in the root
}

description = 'Ticket service'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-oracle'
	// The PDF of the ticket, and the QR code on it.
	implementation 'com.github.librepdf:openpdf:2.0.3'
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'com.google.zxing:javase:3.5.3'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc17'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Make skipped tests visible. The database tests are skipped, not failed, when ticket_test is not configured, and
// a skipped test must never look like a pass: every skip is printed, with a summary line at the end of the run.
tasks.named('test') {
	testLogging {
		events 'skipped', 'failed'
		exceptionFormat 'full'
		showStandardStreams = false
	}
	afterSuite { descriptor, result ->
		if (descriptor.parent == null) {
			println "Ticket tests: ${result.testCount} run, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} SKIPPED"
			if (result.skippedTestCount > 0) {
				println "  Skipped tests need the Oracle test schema (TICKET_TEST_DB_PASSWORD); see the README."
			}
		}
	}
}
