spring.application.name=ticket
server.port=8084

# Local secrets live in services/ticket/.env (git-ignored); see .env.example. Imported as properties.
spring.config.import=optional:file:.env[.properties]

# Own Oracle schema (user): this service never reads another service's tables. Flyway uses the same user.
spring.datasource.url=${TICKET_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${TICKET_DB_USER:ticket}
spring.datasource.password=${TICKET_DB_PASSWORD}

# Shared key for service-to-service calls (/internal/**). There is no default: the service does not start without it.
trainbooking.internal-api-key=${INTERNAL_API_KEY}

# Signs the token in the QR code of every ticket (HMAC-SHA256). There is no default: the service does not start without it.
trainbooking.ticket.signing-key=${TICKET_SIGNING_KEY}

# The times on the ticket are shown in this time zone.
trainbooking.timezone=${TIMEZONE:Africa/Cairo}
