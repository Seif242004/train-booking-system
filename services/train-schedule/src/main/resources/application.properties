spring.application.name=train-schedule
server.port=8081

# Local secrets live in services/train-schedule/.env (git-ignored); see .env.example. Imported as properties.
spring.config.import=optional:file:.env[.properties]

# Own Oracle schema (user): this service never reads another service's tables. Flyway uses the same user.
spring.datasource.url=${TRAIN_SCHEDULE_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${TRAIN_SCHEDULE_DB_USER:train_schedule}
spring.datasource.password=${TRAIN_SCHEDULE_DB_PASSWORD}

# Resource server: tokens are checked against the Keycloak realm (signature via its JWKS, expiry and issuer).
# The issuer is looked up on the first request, so the service can start before Keycloak is up.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8180/realms/train-booking}

# Times of trips are entered and shown as local date-times in this zone, and stored with their offset.
trainbooking.timezone=${TRAINBOOKING_TIMEZONE:Africa/Cairo}
